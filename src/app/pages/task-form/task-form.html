<a class="back-link" [routerLink]="['/', role, 'tasks']"
  ><ion-icon name="arrow-back-outline" />Back to tasks</a
>
<div class="page-heading">
  <div>
    <h1>A clear assignment.</h1>
  </div>
</div>
<form
  class="panel"
  style="max-width: 740px"
  (submit)="$event.preventDefault(); dialog = 'Task assignment'"
>
  <label class="field"
    ><span>Committee</span
    ><select aria-label="Committee">
      <option>Events & Logistics</option>
      <option>Creatives & Media</option>
    </select></label
  ><label class="field"
    ><span>Task title</span
    ><input placeholder="e.g. Prepare the registration materials"
  /></label>
  <div class="form-grid">
    <label class="field"
      ><span>Assign to</span
      ><select aria-label="Assign to">
        <option>Select a member</option>
        <option>Alex Rivera</option>
        <option>Sam Flores</option>
      </select></label
    ><label class="field"
      ><span>Due date and time · Manila</span
      ><input type="datetime-local" value="2026-10-29T17:00"
    /></label>
  </div>
  <div class="form-actions">
    <a class="btn secondary" [routerLink]="['/', role, 'tasks']">Cancel</a
    ><button class="btn" type="submit">
    Assign task<ion-icon name="arrow-forward-outline" />
    </button>
  </div>
</form>
<app-preview-dialog [title]="dialog" (closed)="dialog = ''" />
